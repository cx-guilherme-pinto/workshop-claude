<!doctype html>
<!-- O palco do deck v2 (docs/pt/WORKSHOP-V2-SPEC.md, seccao 8.1). GERADO por build-v2.mjs a partir deste modelo:
     editar o modelo (palco.template.html), nunca o palco.html.
       palco.html[?lang=pt|en]#admin=<token>   os slides a esquerda (1280 x 1080) e o painel a direita (640 x 1080)
       palco.html?notas=1 (ou ?notes=1)         as notas do apresentador, numa segunda janela (BroadcastChannel)
     Setas, espaco e PageUp/PageDown mudam de slide; N abre as notas; F ecra inteiro. Quando a fase do slide muda,
     o palco chama POST <PANEL_URL>/admin/phase com o token de admin (guardado so neste browser). -->
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palco do workshop</title>
<style>
  :root { --bg: #F4EFFE; --surface: #FFFFFF; --ink: #140920; --muted: #4A405A; --accent: #6B34FD; --laranja: #F25928; --lilas: #93A7FF; --escuro: #140920; --escuro-ink: #FCF9FE; --escuro-muted: #B9AEDB; --verde: #1E9E57; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; display: flex; }
  #slide { width: 1280px; height: 1080px; position: relative; background: var(--bg); overflow: hidden; }
  #slide img { width: 1280px; height: 1080px; display: block; }
  #panel { width: 640px; height: 1080px; border: 0; background: #14101c; }
  #status { position: fixed; left: 8px; bottom: 6px; font: 12px Arial; color: #aaa; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 4px; }
  /* o desenho em HTML (sem imagens exportadas): a mesma grelha do .pptx, em pixeis de 1280 x 1080 */
  .h { position: absolute; inset: 0; padding: 43px 67px 0; }
  .h.dark { background: var(--escuro); color: var(--escuro-ink); }
  .tag { display: inline-block; background: var(--accent); color: #fff; font-size: 24px; padding: 8px 18px; }
  .tag.painel { background: var(--laranja); }
  .bloco { position: absolute; right: 67px; top: 51px; font-size: 24px; color: var(--muted); }
  .h h1 { font-size: 46px; margin: 34px 0 28px; line-height: 1.1; }
  .h.dark h1 { font-size: 68px; margin-top: 300px; }
  .h.dark .sub { color: var(--laranja); font-size: 34px; }
  .concept { background: var(--escuro); color: var(--escuro-ink); font-size: 29px; padding: 22px 28px; margin-bottom: 26px; }
  ol.steps { font-size: 27px; margin: 0 0 22px; padding-left: 40px; line-height: 1.55; }
  .code { background: var(--ink); color: var(--escuro-ink); font: 22px "Courier New", monospace; white-space: pre-wrap; padding: 16px 24px; margin: 0 0 16px; }
  .code b { display: block; font: bold 20px Arial; color: var(--lilas); margin-bottom: 8px; }
  .cue { background: var(--laranja); color: #fff; font-size: 25px; font-weight: bold; padding: 14px 22px; margin: 6px 0 16px; }
  .expected { font-size: 25px; }
  .expected b { color: var(--verde); }
  .q { font-size: 54px; font-weight: bold; line-height: 1.15; margin: 40px 120px 26px 0; }
  .support { font-size: 29px; color: var(--muted); margin-bottom: 26px; }
  .opts { display: flex; gap: 24px; margin: 20px 0; }
  .opt { flex: 1; background: var(--surface); padding: 24px; min-height: 360px; position: relative; }
  .opt h3 { font-size: 34px; margin: 10px 0; }
  .opt p { font-size: 24px; color: var(--muted); }
  .opt .code { position: absolute; left: 16px; right: 16px; bottom: 16px; margin: 0; }
  .stats { display: flex; gap: 22px; margin: 10px 0 30px; }
  .stat { flex: 1; background: var(--surface); padding: 22px; font-size: 24px; color: var(--muted); }
  .stat:first-child { background: var(--ink); color: var(--escuro-muted); }
  .stat strong { display: block; font-size: 60px; color: var(--ink); }
  .stat:first-child strong { color: var(--escuro-ink); }
  ul.sees { font-size: 27px; line-height: 1.7; }
  .arrow { position: absolute; right: 67px; top: 300px; font-size: 120px; color: var(--laranja); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--escuro); color: var(--escuro-ink); font-size: 14px; padding: 18px 67px; text-align: right; }
  /* a janela das notas */
  body.notas { background: #111; color: #eee; overflow: auto; }
  .nwrap { max-width: 1000px; margin: 0 auto; padding: 24px; font-size: 20px; line-height: 1.5; }
  .nwrap .top { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  .nwrap h2 { margin: 6px 0; font-size: 30px; }
  .nwrap .clock { font: bold 34px "Courier New", monospace; color: #F1C232; }
  .nwrap pre { white-space: pre-wrap; font: 20px/1.5 Arial; background: #1c1c1c; padding: 18px; border-radius: 6px; }
  .nwrap .next { color: #aaa; }
  .nwrap button { font-size: 20px; padding: 8px 18px; margin-right: 8px; }
</style>
</head>

<script>
const DADOS = {"decks":{"pt":[{"min":0.5,"bloco":"Abertura","fase":"opening","tipo":"titulo","titulo":"Orquestração de agentes com Claude","subtitulo":"Missões, um swarm que constrói um canivete e uma tarefa a sério","n":1,"cab":"[0:00 → 0:30] 0,5 min · opening","notas":"[0:00 → 0:30] 0,5 min · opening\n\nObjetivo: Abrir a sessão e apontar para o painel à direita.\n\nO que dizer:\n- Em 90 minutos vamos fazer, não ouvir: 10 missões curtas, um swarm de agentes e uma tarefa num repositório a sério.\n- O painel à direita mostra o que toda a gente já fez, ao vivo.\n\nOlha para o painel:\n- Se já houver nomes na classificação: \"quem já está no painel fez o setup em casa, obrigado\".\n\nRelógio: deves estar aqui aos 0 min.","rotulo":""},{"min":1.5,"bloco":"Abertura","fase":"opening","tipo":"regras","titulo":"As regras: custo e o que o painel vê","custo":[{"valor":"US$ 5","rotulo":"alvo por pessoa, para o dia todo"},{"valor":"US$ 10","rotulo":"teto de segurança, nunca o objetivo"},{"valor":"0","rotulo":"sessões cortadas por custo"}],"painelVe":["Que missões fizeste e as tuas decisões (agentes, modelo)","O teu nome do GitHub, na classificação","Nunca os teus prompts, o teu código nem tokens","Tudo é apagado à meia-noite"],"n":2,"cab":"[0:30 → 2:00] 1,5 min · opening","notas":"[0:30 → 2:00] 1,5 min · opening\n\nObjetivo: Deixar claro que o custo é medido e não cortado, e o que o painel vê.\n\nO que dizer:\n- O alvo é US$ 5 por pessoa para o dia todo; a US$ 5 e a US$ 10 aparece um aviso, e ninguém é cortado.\n- O painel só recebe contagens e decisões, nunca prompts nem código. Os pontos vêm de cobertura e qualidade, nunca de gastar mais.\n- Tudo o que o painel guardou hoje é apagado à meia-noite.\n\nOlha para o painel:\n- Se alguém perguntar pela privacidade: \"está tudo em docs/PRIVACY.md, e node ~/.workshop-claude/kit/telemetry/ctl.mjs show mostra os últimos 20 eventos tal como saem do teu portátil\".\n\nRelógio: deves estar aqui aos 1 min.","rotulo":""},{"min":1,"bloco":"Abertura","fase":"opening","tipo":"conceito","titulo":"O que vamos fazer hoje","intro":"Três blocos, sempre no teu portátil, sempre a fazer:","blocos":[{"titulo":"Missões · 15 min","texto":"10 missões curtas: plan mode, modelos, subagentes, skills, hooks e /loop, uma de cada vez."},{"titulo":"Projeto 1 · 24 min","texto":"Um swarm de agentes constrói o Canivete: 30 ferramentas e a tua. Tu decides quantos agentes e que modelo."},{"titulo":"Projeto 2 · 37 min","texto":"O mesmo ciclo numa tarefa a sério: uma issue do projeto de treino, ou do teu Jira ou GitHub."}],"rodape":"Levas para casa: o kit instalado, uma memória com o que aprendeste e um ciclo para usar amanhã.","n":3,"cab":"[2:00 → 3:00] 1 min · opening","notas":"[2:00 → 3:00] 1 min · opening\n\nObjetivo: Dar o mapa do dia antes de começar.\n\nO que dizer:\n- Não há bloco de teoria: cada conceito aprende-se numa missão de 2 minutos.\n- Os dois projetos são o mesmo ciclo: primeiro num projeto feito para o workshop, depois numa tarefa a sério.\n- Tudo fica instalado e continua a funcionar depois de hoje.\n\nOlha para o painel:\n- O painel ainda está vazio: \"vai encher-se à medida que fizerem cada coisa\".\n\nRelógio: deves estar aqui aos 2 min.","rotulo":"Conceito"},{"min":1,"bloco":"Abertura","fase":"opening","tipo":"conceito","titulo":"Como vamos trabalhar","intro":"O mesmo ciclo nos dois projetos:","blocos":[{"titulo":"Tu decides","texto":"a spec, quantos agentes e que modelo."},{"titulo":"Os agentes fazem","texto":"em paralelo, cada um com a sua tarefa e o seu teste."},{"titulo":"O gate verifica","texto":"os testes, os segredos, o código perigoso e a revisão do Opus."},{"titulo":"O painel mostra","texto":"o que a sala já fez, ao vivo (nunca os teus prompts)."},{"titulo":"A memória aprende","texto":"as lições de cada projeto, para a próxima vez."}],"n":4,"cab":"[3:00 → 4:00] 1 min · opening","notas":"[3:00 → 4:00] 1 min · opening\n\nObjetivo: Explicar o ciclo que se repete nos dois projetos.\n\nO que dizer:\n- O teu trabalho é decidir e verificar; o dos agentes é fazer.\n- O custo é medido em cada passo, com os tokens reais.\n\nRelógio: deves estar aqui aos 3 min.","rotulo":"Conceito"},{"min":1,"bloco":"Abertura","fase":"opening","tipo":"conceito","faz":true,"titulo":"A tua memória aprende contigo","intro":"A app Agent Memory guarda, no teu portátil, o que aprendes ao longo do dia:","blocos":[{"titulo":"Lê antes de planear","texto":"/demo-plan, /task-intake e /task-plan procuram primeiro o que já sabes."},{"titulo":"Guarda no fim","texto":"/demo-cost e /task-report guardam as lições de cada projeto; /memory guarda uma tua."}],"comandos":[{"rotulo":"Num terminal","cmd":"agent-memory-gui"}],"esperado":"A app abre com o grafo ainda vazio; no fim do dia tem as lições do Canivete e da EX-1","n":5,"cab":"[4:00 → 5:00] 1 min · opening","notas":"[4:00 → 5:00] 1 min · opening\n\nObjetivo: Apresentar a memória e explicar que vai crescer com o trabalho de cada um.\n\nO que dizer:\n- São ficheiros Markdown em ~/.agent-memory, com um índice: fica tudo só no teu portátil.\n- Cada lição fica ligada ao projeto, à tarefa e aos ficheiros: amanhã, o /task-intake de outra issue já a encontra.\n- Vamos voltar a esta janela no fim de cada projeto.\n\nFalhas típicas e resposta:\n- agent-memory-gui não existe → o --check mostra o passo 10; sem a app, tudo o resto funciona (MEMORY UNAVAILABLE)\n- A janela não abre (Windows sem WebView2) → a app abre a mesma interface no browser\n\nRelógio: deves estar aqui aos 4 min.","rotulo":"Faz agora"},{"min":4,"bloco":"Abertura","fase":"opening","tipo":"faca","titulo":"Verifica e liga-te ao painel","passos":["Num terminal, corre o comando do teu sistema","Procura o teu nome na classificação do painel"],"comandos":[{"rotulo":"Mac","cmd":"bash ~/.workshop-claude/setup-mac.sh --check"},{"rotulo":"Windows (PowerShell)","cmd":"powershell -NoProfile -ExecutionPolicy Bypass -File \"$env:USERPROFILE\\.workshop-claude\\setup-windows.ps1\" -Check"},{"rotulo":"Não estás no painel?","cmd":"node \"$HOME/.workshop-claude/kit/telemetry/ctl.mjs\" register"}],"esperado":"A tabela-resumo sem falhas e o teu nome no painel, em \"Inscritas\"","n":6,"cab":"[5:00 → 9:00] 4 min · opening","notas":"[5:00 → 9:00] 4 min · opening\n\nObjetivo: Toda a gente com o kit verificado e registada no painel.\n\nO que dizer:\n- O --check não instala nada: só confirma cada passo e liga-te ao painel.\n- O registo usa o teu login do gh: confirma no teu portátil o email da empresa, e só o nome sai para o painel.\n\nOlha para o painel:\n- Se \"Prontas\" estiver abaixo de metade aos 3 min: \"quem já tem a tabela verde, ajuda o vizinho\".\n- Se \"Inscritas\" for bem menor do que a sala: \"o register a seguir à tabela resolve; sem email @checkmarx.com verificado no GitHub, fazes o workshop na mesma, só não apareces na classificação\".\n\nFalhas típicas e resposta:\n- E-TEL-03: o gh não pode ler os emails → gh auth refresh -h github.com -s user:email e volta a correr o register\n- E-TEL-02: sem email verificado da empresa → acrescenta-o em github.com/settings/emails; o workshop funciona sem isso\n- O comando não existe: o setup não foi feito → corre o one-liner do README agora e segue com o vizinho enquanto instala\n\nRelógio: deves estar aqui aos 5 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Abertura","fase":"opening","tipo":"faca","titulo":"Algum passo falhou?","passos":["Corre o --doctor do teu sistema","Segue o comando que ele sugere, um de cada vez","Continua sem resposta? Trabalha com o vizinho e chama-nos"],"comandos":[{"rotulo":"Mac","cmd":"bash ~/.workshop-claude/setup-mac.sh --doctor"},{"rotulo":"Windows (PowerShell)","cmd":"powershell -NoProfile -ExecutionPolicy Bypass -File \"$env:USERPROFILE\\.workshop-claude\\setup-windows.ps1\" -Doctor"}],"esperado":"A causa provável e o comando que a resolve","n":7,"cab":"[9:00 → 11:00] 2 min · opening","notas":"[9:00 → 11:00] 2 min · opening\n\nObjetivo: Resolver as falhas do setup sem parar a sala.\n\nO que dizer:\n- O --doctor pede ao Haiku um diagnóstico do excerto do log, já sem segredos, e só corre um comando se disseres que sim.\n- Ninguém fica parado: quem não resolver em 2 minutos trabalha com o vizinho.\n\nOlha para o painel:\n- Se \"Prontas\" não subir: \"quem tem ❌ no Claude Code login, corre claude auth login --console\".\n\nFalhas típicas e resposta:\n- Proxy ou rede da empresa → muda para a rede do evento ou um hotspot e repete o --check\n- Login do Claude em falta → claude auth login --console\n\nRelógio: deves estar aqui aos 9 min.","rotulo":"Faz agora"},{"min":1,"bloco":"Missões","fase":"missions","tipo":"painel","titulo":"10 missões, uma grelha vazia","pergunta":"Quantas missões vai a sala acender em 15 minutos?","apoio":"Cada missão valida-se sozinha: fazes, e o painel acende.","comandos":[{"rotulo":"Terminal 1 · missões","cmd":"cd ~/workshop-claude/missions-project\nclaude"}],"n":8,"cab":"[11:00 → 12:00] 1 min · missions","notas":"[11:00 → 12:00] 1 min · missions\n\nObjetivo: Abrir o projeto das missões e lançar a corrida da sala.\n\nO que dizer:\n- São 6 missões guiadas, de 2 minutos cada, e 4 bónus para as esperas.\n- Ninguém carrega em \"feito\": o kit vê a funcionalidade a ser usada e acende a missão.\n- /missions mostra a tua caderneta a qualquer momento.\n\nOlha para o painel:\n- A grelha está a 0 %: \"vamos ver quantas acendemos até ao Projeto 1\".\n\nFalhas típicas e resposta:\n- A pasta missions-project não existe → corre o --check: o passo 9 monta-a\n\nRelógio: deves estar aqui aos 11 min.","rotulo":"Painel"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M1","titulo":"Planear sem tocar","conceito":"O plan mode lê e planeia, mas não escreve nada.","passos":["Carrega em Shift+Tab até aparecer \"plan mode on\"","Faz a pergunta","Lê o plano e sai do plan mode com Shift+Tab"],"comandos":[{"rotulo":"No Claude Code","cmd":"Shift+Tab  →  plan mode on\nComo acrescentarias conversão de volume?"}],"esperado":"Um plano com passos, sem nenhum ficheiro mudado","n":9,"cab":"[12:00 → 14:00] 2 min · missions","notas":"[12:00 → 14:00] 2 min · missions\n\nObjetivo: Mostrar que se pode pensar com o Claude sem risco.\n\nO que dizer:\n- O plan mode é a forma mais barata e segura de começar: o Claude lê o código e propõe, mas não toca em nada.\n- Se o plano te servir, aprovas e ele executa; aqui não aprovamos.\n\nOlha para o painel:\n- Se a M1 estiver abaixo de 50 % a meio: \"Shift+Tab duas vezes; procura plan mode on por baixo da caixa\".\n\nFalhas típicas e resposta:\n- Aparece \"accept edits on\" e não o plan mode → carrega outra vez em Shift+Tab\n- O Claude pergunta \"Would you like to proceed?\" → Esc: não queremos executar\n\nRelógio: deves estar aqui aos 12 min.","rotulo":"Missão M1"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M2","titulo":"O modelo certo","conceito":"Cada modelo tem um preço: Haiku para o simples, Sonnet para o trabalho, Opus para decidir.","passos":["Muda para o Haiku e confirma com Enter","Faz uma pergunta simples","Volta ao Sonnet"],"comandos":[{"rotulo":"No Claude Code","cmd":"/model haiku\nO que faz o units.js? Uma frase.\n/model sonnet"}],"esperado":"A resposta do Haiku, por uma fração do custo","n":10,"cab":"[14:00 → 16:00] 2 min · missions","notas":"[14:00 → 16:00] 2 min · missions\n\nObjetivo: Escolher o modelo pela tarefa, não por hábito.\n\nO que dizer:\n- O Haiku custa cerca de 10 vezes menos do que o Sonnet e chega para perguntas simples.\n- No Projeto 1 vais escolher o modelo de 30 agentes: esta é a mesma decisão, em pequeno.\n\nOlha para o painel:\n- Se a M2 ficar atrás da M1: \"o /model haiku pede uma confirmação; carrega em Enter\".\n\nFalhas típicas e resposta:\n- Fica a pedir confirmação → Enter na opção selecionada\n\nRelógio: deves estar aqui aos 14 min.","rotulo":"Missão M2"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M3","titulo":"Um subagente","conceito":"Um subagente trabalha num contexto limpo e devolve só o resumo.","passos":["Pede o trabalho a um subagente","Vê-o a trabalhar à parte","Recebe só o resultado"],"comandos":[{"rotulo":"No Claude Code","cmd":"Usa um subagente Explore para listar as funções de src/units.js que não têm teste."}],"esperado":"Uma lista curta; a tua sessão principal não ficou cheia de ficheiros","n":11,"cab":"[16:00 → 18:00] 2 min · missions","notas":"[16:00 → 18:00] 2 min · missions\n\nObjetivo: Perceber a peça base de um swarm.\n\nO que dizer:\n- Um swarm é isto multiplicado: muitos subagentes, cada um com o seu contexto e a sua tarefa.\n- O contexto principal fica limpo, e isso também é custo.\n\nOlha para o painel:\n- Se a M3 estiver abaixo da M2: \"escrevam a palavra subagente no pedido\".\n\nFalhas típicas e resposta:\n- O Claude responde sem lançar subagente → pede explicitamente: usa um subagente Explore\n\nRelógio: deves estar aqui aos 16 min.","rotulo":"Missão M3"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M4","titulo":"A tua skill","conceito":"Uma skill é uma receita com nome: um SKILL.md que o Claude Code segue quando a chamas.","passos":["Pede ao Claude para criar a skill","Sai e volta à mesma sessão","Usa a skill pelo nome"],"comandos":[{"rotulo":"No Claude Code","cmd":"Cria .claude/skills/resumo/SKILL.md: resume um ficheiro em 3 linhas\n/exit\nclaude -c\n/resumo src/units.js"}],"esperado":"Um resumo em 3 linhas, feito pela tua skill","n":12,"cab":"[18:00 → 20:00] 2 min · missions","notas":"[18:00 → 20:00] 2 min · missions\n\nObjetivo: Mostrar que uma skill é só um ficheiro que qualquer pessoa escreve.\n\nO que dizer:\n- As skills do workshop (/demo-plan, /task-swarm…) são exatamente isto: Markdown com instruções.\n- O claude -c retoma a conversa anterior: nada se perde ao sair.\n\nOlha para o painel:\n- Se a M4 ficar baixa: \"a skill só aparece depois de sair e voltar; /exit e claude -c\".\n\nFalhas típicas e resposta:\n- /resumo não existe → confirma o ficheiro .claude/skills/resumo/SKILL.md e reabre com claude -c\n\nRelógio: deves estar aqui aos 18 min.","rotulo":"Missão M4"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M5","titulo":"O teu hook","conceito":"Um hook é um comando que o Claude Code corre num evento.","passos":["Pede o hook ao Claude","Pede uma edição qualquer","Abre o edits.log"],"comandos":[{"rotulo":"No Claude Code","cmd":"Acrescenta em .claude/settings.local.json um hook PostToolUse (Edit|Write) que junta a hora e o ficheiro a edits.log.\nAcrescenta um comentário no topo do README.md."}],"esperado":"Uma linha nova no edits.log a cada edição. Estragou algo? Esc Esc volta atrás","n":13,"cab":"[20:00 → 22:00] 2 min · missions","notas":"[20:00 → 22:00] 2 min · missions\n\nObjetivo: Perceber que os hooks automatizam sem pedir ao modelo.\n\nO que dizer:\n- É assim que o kit mede o custo: um hook no fim de cada subagente.\n- O settings.local.json é só teu e não vai para o git.\n- Esc Esc abre o rewind: voltas a antes da edição.\n\nOlha para o painel:\n- Se a M5 estiver abaixo de 50 %: \"metade da sala ainda não tem um hook; quem já tem, ajuda o vizinho\".\n\nFalhas típicas e resposta:\n- O edits.log não aparece → o hook só corre na edição seguinte: pede outra edição\n- O hook ficou no settings.json do kit → pede para o mover para .claude/settings.local.json\n\nRelógio: deves estar aqui aos 20 min.","rotulo":"Missão M5"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"missao","id":"M6","titulo":"Até ficar verde","conceito":"O /loop repete um pedido sozinho, até a condição ser verdade.","passos":["Lança o loop","Deixa-o trabalhar: não escrevas nada","Para quando estiver tudo verde"],"comandos":[{"rotulo":"No Claude Code","cmd":"/loop 1m corre npm test e corrige o primeiro teste vermelho; quando estiver tudo verde, para o loop"}],"esperado":"Os 2 testes vermelhos passam a verde e o loop para","n":14,"cab":"[22:00 → 24:00] 2 min · missions","notas":"[22:00 → 24:00] 2 min · missions\n\nObjetivo: Ver o Claude a trabalhar sozinho com uma condição de paragem.\n\nO que dizer:\n- O projeto vem com 2 testes partidos de propósito.\n- Um loop sem condição de paragem gasta dinheiro: diz sempre quando parar.\n\nOlha para o painel:\n- Se a M6 subir devagar: \"o loop corre de minuto a minuto; enquanto esperam, façam uma bónus\".\n\nFalhas típicas e resposta:\n- O loop não para → Esc e diz: para o loop\n\nRelógio: deves estar aqui aos 22 min.","rotulo":"Missão M6"},{"min":2,"bloco":"Missões","fase":"missions","tipo":"painel","titulo":"O que falta à sala (e as bónus M7 a M10)","pergunta":"Qual é a missão que menos gente fez?","apoio":"As bónus fazem-se nas esperas dos projetos:","comandos":[{"rotulo":"Bónus","cmd":"M7  /btw o que é um subagente?   (dica, sem validação)\nM8  /statusline mostra o modelo e a branch\nM9  claude -p \"Resume o README\" --model haiku > resumo.txt\nM10 /memory guarda uma lição sobre o conversor"}],"n":15,"cab":"[24:00 → 26:00] 2 min · missions","notas":"[24:00 → 26:00] 2 min · missions\n\nObjetivo: Fechar as missões guiadas e apontar as bónus para as esperas.\n\nO que dizer:\n- A missão que pisca no painel é a menos feita: é a que vale a pena ajudar agora.\n- As bónus não têm tempo de palco: fazem-se enquanto os swarms trabalham.\n\nOlha para o painel:\n- Lê em voz alta a missão que pisca e chama quem a tem para mostrar ao vizinho.\n- Se a cobertura média passar de 70 %: \"esta sala está mais rápida do que o ensaio\".\n\nRelógio: deves estar aqui aos 24 min.","rotulo":"Painel"},{"min":2,"bloco":"Projeto 1","fase":"p1","tipo":"painel","titulo":"O que vamos construir: o Canivete","pergunta":"Quantos minutos demoram 8 agentes a construir 30 ferramentas?","apoio":"30 ferramentas do dia a dia, cada uma feita por um agente com o seu teste, mais a tua.","comandos":[{"rotulo":"Terminal 2 · Canivete","cmd":"cd ~/workshop-claude/canivete-project\nclaude"}],"n":16,"cab":"[26:00 → 28:00] 2 min · p1","notas":"[26:00 → 28:00] 2 min · p1\n\nObjetivo: Apresentar o Canivete e plantar a previsão.\n\nO que dizer:\n- Contar palavras, dividir a conta, converter cores: 30 ferramentas que se usam a sério.\n- Cada uma é um agente e um teste; tu decides quantos agentes, que modelo e uma ferramenta tua.\n\nOlha para o painel:\n- Ainda vazio: \"no fim do bloco este gráfico mostra o tempo e o custo de cada swarm da sala\".\n\nFalhas típicas e resposta:\n- A pasta canivete-project não existe → o --check monta-a no passo 9\n\nRelógio: deves estar aqui aos 26 min.","rotulo":"Painel"},{"min":4,"bloco":"Projeto 1","fase":"p1","tipo":"faca","titulo":"Inventa a tua ferramenta","passos":["Copia o exemplo","Muda o título, o conceito, o modelo e os exemplos","Gera a spec e o teste"],"comandos":[{"rotulo":"Mac","cmd":"cp specs/my-tool.example.json specs/my-tool.json\nnode tools/gen.mjs"},{"rotulo":"Windows","cmd":"Copy-Item specs\\my-tool.example.json specs\\my-tool.json\nnode tools/gen.mjs"}],"esperado":"A tua ferramenta my-01, com spec e teste, pronta para o swarm","painel":"Olha para o painel: ferramentas inventadas pela sala","n":17,"cab":"[28:00 → 32:00] 4 min · p1","notas":"[28:00 → 32:00] 4 min · p1\n\nObjetivo: Dar a cada pessoa uma ferramenta que é só dela.\n\nO que dizer:\n- Os modelos são 4: calc, convert, text e generate; o agente só escreve a função run().\n- O gen.mjs diz-te que campo está mal e dá um exemplo.\n\nOlha para o painel:\n- Lê os modelos mais escolhidos: \"a sala prefere calc; quem fez um generate?\".\n\nFalhas típicas e resposta:\n- O gen.mjs recusa o my-tool.json → lê a mensagem: diz o campo e dá um exemplo\n- Sem ideias → usa o exemplo sem mudanças: funciona\n\nRelógio: deves estar aqui aos 28 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Projeto 1","fase":"p1","tipo":"decide","titulo":"Quantos agentes e que modelo?","pergunta":"Escolhe o paralelismo (e o modelo das ferramentas):","opcoes":[{"titulo":"4 agentes","efeito":"Mais lento; a sessão principal coordena pouco","cmd":"--parallel 4"},{"titulo":"8 agentes","efeito":"O meio-termo, por defeito","cmd":"--parallel 8"},{"titulo":"12 agentes","efeito":"Mais rápido, mas o custo não desce","cmd":"--parallel 12"}],"rodape":"Modelo: --model haiku (por defeito, barato) ou --model sonnet (mais caro, quase os mesmos verdes)","n":18,"cab":"[32:00 → 34:00] 2 min · p1","notas":"[32:00 → 34:00] 2 min · p1\n\nObjetivo: Fazer a sala dividir-se, para a comparação no painel ficar rica.\n\nO que dizer:\n- Sugestão: filas da frente 4, meio 8, trás 12.\n- Mais agentes acabam mais depressa, mas a sessão principal coordena mais: o custo não desce.\n\nOlha para o painel:\n- Ainda sem pontos: \"daqui a 10 minutos vemos quem tinha razão\".\n\nRelógio: deves estar aqui aos 32 min.","rotulo":"Decide"},{"min":1,"bloco":"Projeto 1","fase":"p1","tipo":"faca","titulo":"Planeia","passos":["Corre o plano com a tua decisão","Responde à previsão de minutos","Lê as ondas e a estimativa de custo"],"comandos":[{"rotulo":"Terminal 2 · Claude Code","cmd":"/demo-plan --parallel 8 --model haiku"}],"preve":{"pergunta":"Quantos minutos vai demorar o teu swarm?","onde":"O /demo-plan pergunta; podes não responder"},"esperado":"O PLAN.md com 4 ondas e a estimativa de custo","n":19,"cab":"[34:00 → 35:00] 1 min · p1","notas":"[34:00 → 35:00] 1 min · p1\n\nObjetivo: Registar a decisão e a previsão antes de ver o resultado.\n\nO que dizer:\n- O grafo é determinístico: vem das specs, não do modelo.\n- A previsão só vai para o painel, para comparar com o tempo real.\n\nOlha para o painel:\n- Se a mediana prevista aparecer: \"a sala acha X minutos; vamos ver\".\n\nFalhas típicas e resposta:\n- ERROR: plan not found ao avançar → corre o /demo-plan primeiro, na pasta canivete-project\n\nRelógio: deves estar aqui aos 34 min.","rotulo":"Faz agora"},{"min":7,"bloco":"Projeto 1","fase":"p1","tipo":"faca","titulo":"Solta o swarm","passos":["Lança o swarm","Noutro terminal, abre o /status","Nas esperas: uma missão bónus"],"comandos":[{"rotulo":"Terminal 2 · Claude Code","cmd":"/demo-swarm"},{"rotulo":"Outro terminal · o /status","cmd":"cd ~/workshop-claude/canivete-project\nnode server.js\nhttp://localhost:3000/status"}],"esperado":"A grelha enche-se de verdes; 2 ou 3 ferramentas ficam vermelhas","painel":"Olha para o painel: cada ponto é um swarm acabado","n":20,"cab":"[35:00 → 42:00] 7 min · p1","notas":"[35:00 → 42:00] 7 min · p1\n\nObjetivo: Ver um swarm a trabalhar e o efeito das decisões da sala.\n\nO que dizer:\n- Cada quadrado é uma ferramenta: amarelo a trabalhar, verde passou, vermelho falhou.\n- Os vermelhos são o próximo slide: não é azar.\n\nOlha para o painel:\n- Aos 4 min, quando aparecerem pontos: \"os de 12 acabaram primeiro; vejam se gastaram menos\".\n- Se a mediana real ficar longe da prevista: \"prevemos X, demorou Y; quem acertou?\".\n\nFalhas típicas e resposta:\n- Porta 3000 ocupada → o server.js usa a seguinte e diz qual\n- Pede uma permissão a meio → o projeto tem de estar trusted: o setup trata disso; aceita e continua\n- O swarm parou → corre /demo-swarm outra vez: retoma onde estava\n\nRelógio: deves estar aqui aos 35 min.","rotulo":"Faz agora"},{"min":4,"bloco":"Projeto 1","fase":"p1","tipo":"faca","titulo":"Porque é que esta ferramenta falhou?","passos":["Lê a mensagem do teste vermelho","Decide tu a regra que a spec não diz","Escreve-a na spec e repete só essa"],"comandos":[{"rotulo":"No Claude Code","cmd":"Porque falhou o nm-03?"},{"rotulo":"No teu editor, depois","cmd":"tools/nm-03/spec.md   (acrescenta a regra)\n/demo-swarm --retry nm-03"}],"esperado":"O vermelho passa a verde à segunda tentativa","n":21,"cab":"[42:00 → 46:00] 4 min · p1","notas":"[42:00 → 46:00] 4 min · p1\n\nObjetivo: Perceber que o que a spec não decide, o agente adivinha.\n\nO que dizer:\n- As 3 partidas de propósito (nm-03, dn-01, tx-02) omitem uma regra; o agente escolhe a resposta \"óbvia\", e é a errada.\n- A mensagem diz o que a ferramenta devolveu e o que a spec não decide, nunca o valor certo: és tu que decides.\n- Nenhum agente pode mudar uma spec: é o teu trabalho.\n\nOlha para o painel:\n- Se \"specs corrigidas\" ficar a 0 aos 2 min: \"abram o spec.md do vermelho e escrevam uma linha com a regra\".\n\nFalhas típicas e resposta:\n- Volta a ficar vermelho → a regra está ambígua: escreve um exemplo com o valor\n- Não sabe qual é a regra → pensa como quem pediu a ferramenta: o que é correto para um contabilista?\n\nRelógio: deves estar aqui aos 42 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Projeto 1","fase":"p1","tipo":"faca","titulo":"Gate e custo: que decisão ganhou?","passos":["Corre a revisão","Corre o custo","Compara com a previsão e com o painel"],"comandos":[{"rotulo":"Terminal 2 · Claude Code","cmd":"/demo-review\n/demo-cost"}],"esperado":"GATE: APPROVED e o custo por ferramenta verde","painel":"Olha para o painel: custo por verde, por paralelismo e modelo","n":22,"cab":"[46:00 → 48:00] 2 min · p1","notas":"[46:00 → 48:00] 2 min · p1\n\nObjetivo: Fechar o ciclo: qualidade e custo, medidos.\n\nO que dizer:\n- O revisor é o Opus: lê um resumo, não a árvore toda, e diz APPROVED ou REJECTED.\n- O custo vem dos tokens reais e dos preços publicados.\n\nOlha para o painel:\n- Lê o custo por verde de 4, 8 e 12: \"mais agentes não ficou mais barato\".\n- Se houver swarms em Sonnet: \"o Sonnet custou mais e quase não deu mais verdes\".\n\nFalhas típicas e resposta:\n- GATE: REJECTED → lê as reservas; normalmente é um vermelho por corrigir\n\nRelógio: deves estar aqui aos 46 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Projeto 1","fase":"p1","tipo":"faca","saltar":true,"titulo":"Usa o teu Canivete","passos":["Abre o Canivete no browser","Procura a tua ferramenta","Usa-a a sério"],"comandos":[{"rotulo":"Browser","cmd":"http://localhost:3000"}],"esperado":"A tua ferramenta my-01 a funcionar ao lado das outras 30","n":23,"cab":"[48:00 → 50:00] 2 min · p1 · PODE SALTAR","notas":"[48:00 → 50:00] 2 min · p1 · PODE SALTAR\n\nObjetivo: Ver o resultado e ganhar confiança no que foi feito.\n\nO que dizer:\n- Tudo o que está ali foi escrito por agentes nos últimos 15 minutos, com testes.\n\nFalhas típicas e resposta:\n- A página não abre → o node server.js tem de estar a correr no outro terminal\n\nRelógio: deves estar aqui aos 48 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Projeto 2","fase":"p2","tipo":"painel","titulo":"O mesmo ciclo, noutro repositório","pergunta":"O que muda quando a tarefa é a sério?","apoio":"intake → plan → swarm → gate → report → memória: a mesma orquestração, agora com as skills /task-*.","comandos":[{"rotulo":"Terminal 3 · projeto de treino","cmd":"cd ~/workshop-claude/practice-project\nclaude"}],"n":24,"cab":"[50:00 → 52:00] 2 min · p2","notas":"[50:00 → 52:00] 2 min · p2\n\nObjetivo: Ligar o Projeto 2 ao que já fizeram.\n\nO que dizer:\n- O plan é o /demo-plan, o swarm é o /demo-swarm, o gate é o /demo-review: a diferença é que a tarefa vem de uma issue.\n- O caminho por defeito é a Biblioteca Municipal, sem login; quem tiver Jira ou GitHub a funcionar pode usar uma issue sua.\n\nOlha para o painel:\n- O funil está vazio: \"daqui a 30 minutos queremos a sala toda no fim\".\n\nRelógio: deves estar aqui aos 50 min.","rotulo":"Painel"},{"min":4,"bloco":"Projeto 2","fase":"p2","tipo":"faca","titulo":"Lê a issue","passos":["No projeto de treino, abre o Claude Code","Lê a issue EX-1 (é um JSON, sem login)","Já tens Jira ou GitHub? Usa uma tua"],"comandos":[{"rotulo":"Terminal 3 · Claude Code","cmd":"/task-intake issues/EX-1.json"},{"rotulo":"Opcional · o teu repositório","cmd":"/task-intake ABC-123"}],"esperado":"O .workshop/task.md com a issue, os critérios e o que a memória já sabe","n":25,"cab":"[52:00 → 56:00] 4 min · p2","notas":"[52:00 → 56:00] 4 min · p2\n\nObjetivo: Pôr toda a gente com uma tarefa lida.\n\nO que dizer:\n- A EX-1 é pequena: validar o ISBN e o email ao criar livros e leitores.\n- O intake só lê: não escreve nada no Jira nem no GitHub.\n\nOlha para o painel:\n- Se o funil não sair de \"intake\" aos 3 min: \"confirmem que estão na pasta practice-project\".\n\nFalhas típicas e resposta:\n- Issue não encontrada → corre na pasta practice-project: o caminho é issues/EX-1.json\n\nRelógio: deves estar aqui aos 52 min.","rotulo":"Faz agora"},{"min":6,"bloco":"Projeto 2","fase":"p2","tipo":"decide","titulo":"Quantos agentes?","pergunta":"O /task-plan propõe um número e diz porquê. Decide:","opcoes":[{"titulo":"Aprovar","efeito":"Segue o plano como está","cmd":"sim"},{"titulo":"Menos agentes","efeito":"Mais barato, mais lento; menos conflitos","cmd":"menos agentes"},{"titulo":"Mais agentes","efeito":"Mais rápido, só se as tarefas não mexem nos mesmos ficheiros","cmd":"mais agentes"}],"rodape":"Primeiro corre /task-plan e lê o porquê do número.","painel":"Olha para o painel: quantos agentes escolheu a sala","n":26,"cab":"[56:00 → 62:00] 6 min · p2","notas":"[56:00 → 62:00] 6 min · p2\n\nObjetivo: Decidir com base no porquê, não no número.\n\nO que dizer:\n- O planner lê a issue e o código e propõe subtarefas: tarefas que mexem nos mesmos ficheiros vão em lotes diferentes.\n- Ajustar é normal: o plano é uma proposta.\n\nOlha para o painel:\n- Lê o histograma: \"a maioria tem 2 ou 3; quem ajustou, porquê?\".\n\nFalhas típicas e resposta:\n- PLAN INVALID → pede ao planner para corrigir: a mensagem diz o que falta\n\nRelógio: deves estar aqui aos 56 min.","rotulo":"Decide"},{"min":12,"bloco":"Projeto 2","fase":"p2","tipo":"faca","titulo":"Põe o swarm a trabalhar","passos":["Lança o swarm","Noutro terminal, abre o dashboard","Nas esperas: as missões bónus que faltam"],"comandos":[{"rotulo":"Terminal 3 · Claude Code","cmd":"/task-swarm"},{"rotulo":"Outro terminal · na pasta do projeto","cmd":"node \"$HOME/.workshop-claude/kit/orchestrator/dashboard.mjs\""}],"esperado":"As subtarefas a verde; o estado fica em .workshop/","painel":"Olha para o painel: o funil avança","n":27,"cab":"[62:00 → 74:00] 12 min · p2","notas":"[62:00 → 74:00] 12 min · p2\n\nObjetivo: Ver o swarm numa tarefa real, com retoma.\n\nO que dizer:\n- Esc interrompe; /task-swarm de novo retoma onde estava.\n- Se o planner decidiu worktrees, cada agente trabalha numa cópia do repositório.\n\nOlha para o painel:\n- A meio, lê o funil: \"metade já está no gate; quem ainda está no swarm, deixem correr\".\n\nFalhas típicas e resposta:\n- Uma subtarefa falha 3 vezes → lê o motivo no dashboard; corrige a descrição e corre --retry\n- O dashboard não mostra nada → tem de correr na pasta do projeto\n\nRelógio: deves estar aqui aos 62 min.","rotulo":"Faz agora"},{"min":5,"bloco":"Projeto 2","fase":"p2","tipo":"faca","titulo":"O gate","passos":["Corre o gate","Lê o veredito e as reservas","Corrige o que ele pedir, se pedir"],"comandos":[{"rotulo":"Terminal 3 · Claude Code","cmd":"/task-gate"}],"esperado":"GATE: APPROVED, com os testes, os segredos e o código perigoso verificados","n":28,"cab":"[74:00 → 79:00] 5 min · p2","notas":"[74:00 → 79:00] 5 min · p2\n\nObjetivo: Não entregar nada sem verificação.\n\nO que dizer:\n- O gate corre os testes, procura segredos e código perigoso, e pede o veredito ao Opus.\n- Um REJECTED não é um falhanço: é o gate a fazer o trabalho dele.\n\nOlha para o painel:\n- Se os gates aprovados ficarem baixos: \"leiam as reservas; quase sempre é um teste por correr\".\n\nFalhas típicas e resposta:\n- GATE: REJECTED → corrige o que as reservas dizem e corre /task-gate outra vez\n\nRelógio: deves estar aqui aos 74 min.","rotulo":"Faz agora"},{"min":4,"bloco":"Projeto 2","fase":"p2","tipo":"faca","titulo":"O relatório e a memória","passos":["Gera o relatório","Guarda a lição na memória","No teu repositório: confirma antes de cada escrita"],"comandos":[{"rotulo":"Terminal 3 · Claude Code","cmd":"/task-report\n/memory guarda a lição da EX-1"}],"esperado":"O report.md no projeto de treino e uma memória nova","n":29,"cab":"[79:00 → 83:00] 4 min · p2","notas":"[79:00 → 83:00] 4 min · p2\n\nObjetivo: Fechar a tarefa e guardar o que se aprendeu.\n\nO que dizer:\n- No projeto de treino o relatório fica em report.md; no Jira ou no GitHub, o /task-report só escreve depois do teu sim.\n- A memória fica no teu portátil e o próximo /task-intake vai lê-la.\n\nOlha para o painel:\n- Se o funil chegar a \"report\": \"quem fechou, avança para a EX-3\".\n\nFalhas típicas e resposta:\n- MEMORY UNAVAILABLE → a app Agent Memory não está instalada: o resto funciona; --check mostra o passo 10\n\nRelógio: deves estar aqui aos 79 min.","rotulo":"Faz agora"},{"min":4,"bloco":"Projeto 2","fase":"p2","tipo":"faca","titulo":"Agora sozinho: EX-3","passos":["Repete o ciclo na EX-3, sem slides","intake → plan → swarm → gate → report","Ainda na EX-1? Continua nela"],"comandos":[{"rotulo":"Terminal 3 · Claude Code","cmd":"/task-intake issues/EX-3.json\n/task-plan\n/task-swarm\n/task-gate\n/task-report"}],"esperado":"A EX-3 fechada: um leitor deixa de ver os empréstimos de outro","n":30,"cab":"[83:00 → 87:00] 4 min · p2","notas":"[83:00 → 87:00] 4 min · p2\n\nObjetivo: Fazer o ciclo sem ajuda.\n\nO que dizer:\n- A EX-3 é uma falha de segurança pequena (IDOR), com um teste de autorização já escrito.\n- É o teste final do workshop: se consegues sozinho, consegues amanhã no teu repositório.\n\nOlha para o painel:\n- Lê as issues fechadas: \"já há N EX-3 fechadas\".\n\nFalhas típicas e resposta:\n- Não acabou a EX-1 → continua na EX-1: a EX-3 é opcional\n\nRelógio: deves estar aqui aos 83 min.","rotulo":"Faz agora"},{"min":2,"bloco":"Fecho","fase":"closing","tipo":"painel","titulo":"O dia em números e 3 ideias para levar","pergunta":"O que fazias diferente amanhã?","ideias":["O que a spec não decide, o agente adivinha","Mais agentes não é mais barato: decide o paralelismo","Haiku para o simples, e mede sempre o custo"],"n":31,"cab":"[87:00 → 89:00] 2 min · closing","notas":"[87:00 → 89:00] 2 min · closing\n\nObjetivo: Fechar com os números da sala e 3 ideias concretas.\n\nO que dizer:\n- Os 3 números do painel são de \"fazer melhor\": custo por verde, verdes à primeira, % em Haiku.\n- Tudo o que instalaram continua a funcionar amanhã: comecem pela próxima issue que vos atribuírem com /task-intake.\n\nOlha para o painel:\n- Lê o custo médio por pessoa contra o alvo de US$ 5.\n- Lê a % de verdes à primeira: \"é isto que uma boa spec compra\".\n\nRelógio: deves estar aqui aos 87 min.","rotulo":"Painel"},{"min":1,"bloco":"Fecho","fase":"closing","tipo":"perguntas","titulo":"Perguntas","subtitulo":"Sem limite de tempo","rodape":"https://github.com/cx-guilherme-pinto/workshop-claude","n":32,"cab":"[89:00 → 90:00] 1 min · closing","notas":"[89:00 → 90:00] 1 min · closing\n\nObjetivo: Abrir as perguntas.\n\nO que dizer:\n- As perguntas podem passar dos 90 minutos. Quem não fez o setup instala agora.\n- O painel apaga tudo à meia-noite; a caderneta e as memórias ficam no vosso portátil.\n\nOlha para o painel:\n- Se der tempo: mostra a classificação final.\n\nRelógio: deves estar aqui aos 89 min.","rotulo":""}],"en":[{"min":0.5,"bloco":"Opening","fase":"opening","tipo":"titulo","titulo":"Agent orchestration with Claude","subtitulo":"Missions, a swarm that builds a pocketknife and a real task","n":1,"cab":"[0:00 → 0:30] 0.5 min · opening","notas":"[0:00 → 0:30] 0.5 min · opening\n\nGoal: Open the session and point at the panel on the right.\n\nWhat to say:\n- For 90 minutes we do instead of listen: 10 short missions, a swarm of agents and a task in a real repository.\n- The panel on the right shows what everyone has done, live.\n\nLook at the panel:\n- If there are already names on the leaderboard: \"whoever is on the panel ran the setup at home, thank you\".\n\nClock: you should be here at 0 min.","rotulo":""},{"min":1.5,"bloco":"Opening","fase":"opening","tipo":"regras","titulo":"The rules: cost and what the panel sees","custo":[{"valor":"US$ 5","rotulo":"target per person, for the whole day"},{"valor":"US$ 10","rotulo":"safety ceiling, never the goal"},{"valor":"0","rotulo":"sessions cut off for cost"}],"painelVe":["Which missions you did and your decisions (agents, model)","Your GitHub name, on the leaderboard","Never your prompts, your code or any token","Everything is deleted at midnight"],"n":2,"cab":"[0:30 → 2:00] 1.5 min · opening","notas":"[0:30 → 2:00] 1.5 min · opening\n\nGoal: Make clear that cost is measured, not cut, and what the panel sees.\n\nWhat to say:\n- The target is US$ 5 per person for the whole day; at US$ 5 and US$ 10 a warning shows, and nobody is cut off.\n- The panel only gets counts and decisions, never prompts or code. Points come from coverage and quality, never from spending more.\n- Everything the panel kept today is deleted at midnight.\n\nLook at the panel:\n- If someone asks about privacy: \"it is all in docs/PRIVACY.md, and node ~/.workshop-claude/kit/telemetry/ctl.mjs show prints the last 20 events exactly as they leave your laptop\".\n\nClock: you should be here at 1 min.","rotulo":""},{"min":1,"bloco":"Opening","fase":"opening","tipo":"conceito","titulo":"What we will do today","intro":"Three blocks, always on your laptop, always hands-on:","blocos":[{"titulo":"Missions · 15 min","texto":"10 short missions: plan mode, models, subagents, skills, hooks and /loop, one at a time."},{"titulo":"Project 1 · 24 min","texto":"A swarm of agents builds the Pocketknife: 30 tools plus yours. You decide how many agents and which model."},{"titulo":"Project 2 · 37 min","texto":"The same cycle on a real task: an issue from the practice project, or from your Jira or GitHub."}],"rodape":"You take home: the kit installed, a memory of what you learned and a cycle to use tomorrow.","n":3,"cab":"[2:00 → 3:00] 1 min · opening","notas":"[2:00 → 3:00] 1 min · opening\n\nGoal: Give the map of the day before starting.\n\nWhat to say:\n- There is no theory block: each concept is learned in a 2-minute mission.\n- The two projects are the same cycle: first on a project made for the workshop, then on a real task.\n- Everything stays installed and keeps working after today.\n\nLook at the panel:\n- The panel is still empty: \"it fills up as you do each thing\".\n\nClock: you should be here at 2 min.","rotulo":"Concept"},{"min":1,"bloco":"Opening","fase":"opening","tipo":"conceito","titulo":"How we will work","intro":"The same cycle in both projects:","blocos":[{"titulo":"You decide","texto":"the spec, how many agents and which model."},{"titulo":"The agents do","texto":"in parallel, each with its own task and its own test."},{"titulo":"The gate checks","texto":"the tests, secrets, dangerous code and the Opus review."},{"titulo":"The panel shows","texto":"what the room has done, live (never your prompts)."},{"titulo":"The memory learns","texto":"the lessons of each project, for next time."}],"n":4,"cab":"[3:00 → 4:00] 1 min · opening","notas":"[3:00 → 4:00] 1 min · opening\n\nGoal: Explain the cycle that repeats in both projects.\n\nWhat to say:\n- Your job is to decide and to check; the agents’ job is to do.\n- The cost is measured at every step, from the real tokens.\n\nClock: you should be here at 3 min.","rotulo":"Concept"},{"min":1,"bloco":"Opening","fase":"opening","tipo":"conceito","faz":true,"titulo":"Your memory learns with you","intro":"The Agent Memory app keeps, on your laptop, what you learn during the day:","blocos":[{"titulo":"It reads before planning","texto":"/demo-plan, /task-intake and /task-plan first look for what you already know."},{"titulo":"It saves at the end","texto":"/demo-cost and /task-report save the lessons of each project; /memory saves one of yours."}],"comandos":[{"rotulo":"In a terminal","cmd":"agent-memory-gui"}],"esperado":"The app opens with an empty graph; by the end of the day it has the lessons of the Pocketknife and EX-1","n":5,"cab":"[4:00 → 5:00] 1 min · opening","notas":"[4:00 → 5:00] 1 min · opening\n\nGoal: Introduce the memory and explain that it grows with each person’s work.\n\nWhat to say:\n- They are Markdown files in ~/.agent-memory, with an index: everything stays on your laptop.\n- Each lesson is linked to the project, the task and the files: tomorrow, /task-intake on another issue already finds it.\n- We come back to this window at the end of each project.\n\nTypical failures and the answer:\n- agent-memory-gui does not exist → --check shows step 10; without the app everything else works (MEMORY UNAVAILABLE)\n- The window does not open (Windows without WebView2) → the app opens the same interface in the browser\n\nClock: you should be here at 4 min.","rotulo":"Do it now"},{"min":4,"bloco":"Opening","fase":"opening","tipo":"faca","titulo":"Check and join the panel","passos":["In a terminal, run the command for your system","Look for your name on the panel leaderboard"],"comandos":[{"rotulo":"Mac","cmd":"bash ~/.workshop-claude/setup-mac.sh --check"},{"rotulo":"Windows (PowerShell)","cmd":"powershell -NoProfile -ExecutionPolicy Bypass -File \"$env:USERPROFILE\\.workshop-claude\\setup-windows.ps1\" -Check"},{"rotulo":"Not on the panel?","cmd":"node \"$HOME/.workshop-claude/kit/telemetry/ctl.mjs\" register"}],"esperado":"The summary table with no failures and your name on the panel, under \"Registered\"","n":6,"cab":"[5:00 → 9:00] 4 min · opening","notas":"[5:00 → 9:00] 4 min · opening\n\nGoal: Everyone with the kit checked and registered on the panel.\n\nWhat to say:\n- --check installs nothing: it only confirms each step and connects you to the panel.\n- The registration uses your gh login: it checks the company email on your laptop, and only the name goes to the panel.\n\nLook at the panel:\n- If \"Ready\" is below half at 3 min: \"whoever has a green table, help your neighbour\".\n- If \"Registered\" is well below the room: \"the register command under the table fixes it; without a verified @checkmarx.com email on GitHub you do the workshop all the same, you just do not appear on the leaderboard\".\n\nTypical failures and the answer:\n- E-TEL-03: gh cannot read the emails → gh auth refresh -h github.com -s user:email and run register again\n- E-TEL-02: no verified company email → add it at github.com/settings/emails; the workshop works without it\n- The command does not exist: no setup yet → run the one-liner from the README now and pair with a neighbour while it installs\n\nClock: you should be here at 5 min.","rotulo":"Do it now"},{"min":2,"bloco":"Opening","fase":"opening","tipo":"faca","titulo":"Did a step fail?","passos":["Run --doctor for your system","Follow the command it suggests, one at a time","Still stuck? Pair with a neighbour and call us"],"comandos":[{"rotulo":"Mac","cmd":"bash ~/.workshop-claude/setup-mac.sh --doctor"},{"rotulo":"Windows (PowerShell)","cmd":"powershell -NoProfile -ExecutionPolicy Bypass -File \"$env:USERPROFILE\\.workshop-claude\\setup-windows.ps1\" -Doctor"}],"esperado":"The likely cause and the command that fixes it","n":7,"cab":"[9:00 → 11:00] 2 min · opening","notas":"[9:00 → 11:00] 2 min · opening\n\nGoal: Fix setup failures without stopping the room.\n\nWhat to say:\n- --doctor asks Haiku for a diagnosis of the log excerpt, with the secrets already removed, and only runs a command if you say yes.\n- Nobody waits: whoever cannot fix it in 2 minutes pairs with a neighbour.\n\nLook at the panel:\n- If \"Ready\" does not go up: \"whoever has ❌ on Claude Code login, run claude auth login --console\".\n\nTypical failures and the answer:\n- Company proxy or network → switch to the event network or a hotspot and run --check again\n- Claude login missing → claude auth login --console\n\nClock: you should be here at 9 min.","rotulo":"Do it now"},{"min":1,"bloco":"Missions","fase":"missions","tipo":"painel","titulo":"10 missions, an empty grid","pergunta":"How many missions will the room light up in 15 minutes?","apoio":"Each mission checks itself: you do it, and the panel lights up.","comandos":[{"rotulo":"Terminal 1 · missions","cmd":"cd ~/workshop-claude/missions-project\nclaude"}],"n":8,"cab":"[11:00 → 12:00] 1 min · missions","notas":"[11:00 → 12:00] 1 min · missions\n\nGoal: Open the missions project and start the room race.\n\nWhat to say:\n- There are 6 guided missions of 2 minutes each, and 4 bonus ones for the waits.\n- Nobody clicks \"done\": the kit sees the feature being used and lights up the mission.\n- /missions shows your mission book at any time.\n\nLook at the panel:\n- The grid is at 0 %: \"let us see how many we light up before Project 1\".\n\nTypical failures and the answer:\n- The missions-project folder does not exist → run --check: step 9 sets it up\n\nClock: you should be here at 11 min.","rotulo":"Panel"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M1","titulo":"Plan without touching","conceito":"Plan mode reads and plans, but writes nothing.","passos":["Press Shift+Tab until \"plan mode on\" shows","Ask the question","Read the plan and leave plan mode with Shift+Tab"],"comandos":[{"rotulo":"In Claude Code","cmd":"Shift+Tab  →  plan mode on\nHow would you add volume conversion?"}],"esperado":"A plan with steps, and no file changed","n":9,"cab":"[12:00 → 14:00] 2 min · missions","notas":"[12:00 → 14:00] 2 min · missions\n\nGoal: Show that you can think with Claude at no risk.\n\nWhat to say:\n- Plan mode is the cheapest and safest way to start: Claude reads the code and proposes, but touches nothing.\n- If the plan works for you, you approve it and it runs; here we do not approve.\n\nLook at the panel:\n- If M1 is below 50 % halfway: \"Shift+Tab twice; look for plan mode on under the input box\".\n\nTypical failures and the answer:\n- \"accept edits on\" shows instead of plan mode → press Shift+Tab again\n- Claude asks \"Would you like to proceed?\" → Esc: we do not want to run it\n\nClock: you should be here at 12 min.","rotulo":"Mission M1"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M2","titulo":"The right model","conceito":"Each model has a price: Haiku for the simple, Sonnet for the work, Opus to decide.","passos":["Switch to Haiku and confirm with Enter","Ask a simple question","Go back to Sonnet"],"comandos":[{"rotulo":"In Claude Code","cmd":"/model haiku\nWhat does units.js do? One sentence.\n/model sonnet"}],"esperado":"Haiku’s answer, for a fraction of the cost","n":10,"cab":"[14:00 → 16:00] 2 min · missions","notas":"[14:00 → 16:00] 2 min · missions\n\nGoal: Choose the model by the task, not by habit.\n\nWhat to say:\n- Haiku costs about 10 times less than Sonnet and is enough for simple questions.\n- In Project 1 you will choose the model of 30 agents: this is the same decision, in small.\n\nLook at the panel:\n- If M2 lags behind M1: \"/model haiku asks for a confirmation; press Enter\".\n\nTypical failures and the answer:\n- It keeps asking for confirmation → Enter on the selected option\n\nClock: you should be here at 14 min.","rotulo":"Mission M2"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M3","titulo":"A subagent","conceito":"A subagent works in a clean context and returns only the summary.","passos":["Hand the work to a subagent","Watch it work on the side","Get only the result back"],"comandos":[{"rotulo":"In Claude Code","cmd":"Use an Explore subagent to list the functions in src/units.js that have no test."}],"esperado":"A short list; your main session did not fill up with files","n":11,"cab":"[16:00 → 18:00] 2 min · missions","notas":"[16:00 → 18:00] 2 min · missions\n\nGoal: Understand the building block of a swarm.\n\nWhat to say:\n- A swarm is this, multiplied: many subagents, each with its own context and task.\n- The main context stays clean, and that is cost too.\n\nLook at the panel:\n- If M3 is below M2: \"write the word subagent in the request\".\n\nTypical failures and the answer:\n- Claude answers without launching a subagent → ask explicitly: use an Explore subagent\n\nClock: you should be here at 16 min.","rotulo":"Mission M3"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M4","titulo":"Your skill","conceito":"A skill is a named recipe: a SKILL.md that Claude Code follows when you call it.","passos":["Ask Claude to create the skill","Leave and come back to the same session","Use the skill by name"],"comandos":[{"rotulo":"In Claude Code","cmd":"Create .claude/skills/summary/SKILL.md: summarise a file in 3 lines\n/exit\nclaude -c\n/summary src/units.js"}],"esperado":"A 3-line summary, made by your skill","n":12,"cab":"[18:00 → 20:00] 2 min · missions","notas":"[18:00 → 20:00] 2 min · missions\n\nGoal: Show that a skill is just a file anyone can write.\n\nWhat to say:\n- The workshop skills (/demo-plan, /task-swarm…) are exactly this: Markdown with instructions.\n- claude -c resumes the previous conversation: nothing is lost when you leave.\n\nLook at the panel:\n- If M4 stays low: \"the skill only shows after you leave and come back; /exit and claude -c\".\n\nTypical failures and the answer:\n- /summary does not exist → check the file .claude/skills/summary/SKILL.md and reopen with claude -c\n\nClock: you should be here at 18 min.","rotulo":"Mission M4"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M5","titulo":"Your hook","conceito":"A hook is a command Claude Code runs on an event.","passos":["Ask Claude for the hook","Ask for any edit","Open edits.log"],"comandos":[{"rotulo":"In Claude Code","cmd":"Add a PostToolUse hook (Edit|Write) in .claude/settings.local.json that appends the time and the file to edits.log.\nAdd a comment at the top of README.md."}],"esperado":"A new line in edits.log on every edit. Broke something? Esc Esc goes back","n":13,"cab":"[20:00 → 22:00] 2 min · missions","notas":"[20:00 → 22:00] 2 min · missions\n\nGoal: Understand that hooks automate without asking the model.\n\nWhat to say:\n- This is how the kit measures cost: a hook at the end of each subagent.\n- settings.local.json is only yours and does not go to git.\n- Esc Esc opens rewind: you go back to before the edit.\n\nLook at the panel:\n- If M5 is below 50 %: \"half the room has no hook yet; whoever has one, help your neighbour\".\n\nTypical failures and the answer:\n- edits.log does not show up → the hook only runs on the next edit: ask for another one\n- The hook went into the kit’s settings.json → ask to move it to .claude/settings.local.json\n\nClock: you should be here at 20 min.","rotulo":"Mission M5"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"missao","id":"M6","titulo":"Until it is green","conceito":"/loop repeats a request on its own, until the condition is true.","passos":["Start the loop","Let it work: do not type anything","It stops when everything is green"],"comandos":[{"rotulo":"In Claude Code","cmd":"/loop 1m run npm test and fix the first red test; when everything is green, stop the loop"}],"esperado":"The 2 red tests turn green and the loop stops","n":14,"cab":"[22:00 → 24:00] 2 min · missions","notas":"[22:00 → 24:00] 2 min · missions\n\nGoal: See Claude work on its own with a stop condition.\n\nWhat to say:\n- The project ships with 2 tests broken on purpose.\n- A loop with no stop condition burns money: always say when to stop.\n\nLook at the panel:\n- If M6 goes up slowly: \"the loop runs every minute; while you wait, do a bonus one\".\n\nTypical failures and the answer:\n- The loop does not stop → Esc and say: stop the loop\n\nClock: you should be here at 22 min.","rotulo":"Mission M6"},{"min":2,"bloco":"Missions","fase":"missions","tipo":"painel","titulo":"What the room is missing (and the bonus M7 to M10)","pergunta":"Which mission did the fewest people do?","apoio":"The bonus ones are for the waits in the projects:","comandos":[{"rotulo":"Bonus","cmd":"M7  /btw what is a subagent?   (a tip, not checked)\nM8  /statusline show the model and the branch\nM9  claude -p \"Summarise the README\" --model haiku > summary.txt\nM10 /memory save a lesson about the converter"}],"n":15,"cab":"[24:00 → 26:00] 2 min · missions","notas":"[24:00 → 26:00] 2 min · missions\n\nGoal: Close the guided missions and point the bonus ones at the waits.\n\nWhat to say:\n- The mission blinking on the panel is the least nel:\n- Read the cost per green for 4, 8 and 12: \"more agents did not get cheaper\".\n- If there are Sonnet swarms: \"Sonnet cost more and gave hardly any more greens\".\n\nTypical failures and the answer:\n- GATE: REJECTED → read the reservations; usually it is a red one still to fix\n\nClock: you should be here at 46 min.","rotulo":"Do it now"},{"min":2,"bloco":"Project 1","fase":"p1","tipo":"faca","saltar":true,"titulo":"Use your Pocketknife","passos":["Open the Pocketknife in the browser","Find your tool","Use it for real"],"comandos":[{"rotulo":"Browser","cmd":"http://localhost:3000"}],"esperado":"Your tool my-01 working next to the other 30","n":23,"cab":"[48:00 → 50:00] 2 min · p1 · CAN SKIP","notas":"[48:00 → 50:00] 2 min · p1 · CAN SKIP\n\nGoal: See the result and trust what was made.\n\nWhat to say:\n- Everything there was written by agents in the last 15 minutes, with tests.\n\nTypical failures and the answer:\n- The page does not open → node server.js must be running in the other terminal\n\nClock: you should be here at 48 min.","rotulo":"Do it now"},{"min":2,"bloco":"Project 2","fase":"p2","tipo":"painel","titulo":"The same cycle, in another repository","pergunta":"What changes when the task is real?","apoio":"intake → plan → swarm → gate → report → memory: the same orchestration, now with the /task-* skills.","comandos":[{"rotulo":"Terminal 3 · practice project","cmd":"cd ~/workshop-claude/practice-project\nclaude"}],"n":24,"cab":"[50:00 → 52:00] 2 min · p2","notas":"[50:00 → 52:00] 2 min · p2\n\nGoal: Connect Project 2 to what they already did.\n\nWhat to say:\n- The plan is /demo-plan, the swarm is /demo-swarm, the gate is /demo-review: the difference is that the task comes from an issue.\n- The default path is the Municipal Library, with no login; whoever has Jira or GitHub working can use their own issue.\n\nLook at the panel:\n- The funnel is empty: \"in 30 minutes we want the whole room at the end\".\n\nClock: you should be here at 50 min.","rot   if (d.tipo === 'conceito') return `<div class="h">${tag}<h1>${esc(d.titulo)}</h1>${d.intro ? `<div class="support">${esc(d.intro)}</div>` : ''}<ol class="steps">${d.blocos.map((b) => `<li><b>${esc(b.titulo)}</b> ${esc(b.texto)}</li>`).join('')}</ol>${cmds}${d.rodape ? `<div class="concept">${esc(d.rodape)}</div>` : ''}${pe}<div class="foot"></div></div>`;
  if (d.tipo === 'painel') return `<div class="h">${tag}<h1>${esc(d.titulo)}</h1><div class="arrow">➜</div><div class="q">${esc(d.pergunta)}</div>${d.apoio ? `<div class="support">${esc(d.apoio)}</div>` : ''}${d.ideias ? `<ol class="steps">${d.ideias.map((t) => `<li><b>${esc(t)}</b></li>`).join('')}</ol>` : ''}${cmds}<div class="foot"></div></div>`;
  return `<div class="h">${tag}<h1>${esc(d.titulo)}</h1>${d.conceito ? `<div class="concept">💡 ${esc(d.conceito)}</div>` : ''}<ol class="steps">${(d.passos || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ol>${cmds}${d.preve ? `<div class="concept">⏱ ${esc(d.preve.pergunta)}<br><small>${esc(d.preve.onde)}</small></div>` : ''}${pe}<div class="foot"></div></div>`;
}

// ---------- a janela das notas ----------
if (q.get('notas') === '1' || q.get('notes') === '1') {
  document.body.className = 'notas';
  document.body.innerHTML = '<div class="nwrap"><div class="top"><div><small id="n-pos"></small><h2 id="n-title"></h2></div><div class="clock" id="n-clock">0:00</div></div><p><button id="n-prev">◀</button><button id="n-next">▶</button><span class="next" id="n-next-title"></span></p><pre id="n-notes"></pre></div>';
  const t0 = Date.now();
  const mostrar = (i) => {
    const d = deck[i];
    document.getElementById('n-pos').textContent = `${i + 1} / ${deck.length} · ${d.bloco} · ${d.fase}`;
    document.getElementById('n-title').textContent = d.titulo;
    document.getElementById('n-notes').textContent = d.notas;
    document.getElementById('n-next-title').textContent = deck[i + 1] ? `→ ${deck[i + 1].titulo}` : '';
  };
  mostrar(atual);
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById('n-clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);
  canal?.addEventListener('message', (e) => { if (e.data?.lang === lang && e.data.type === 'slide') { atual = e.data.i; mostrar(atual); } });
  document.getElementById('n-prev').onclick = () => canal?.postMessage({ type: 'nav', lang, d: -1 });
  document.getElementById('n-next').onclick = () => canal?.postMessage({ type: 'nav', lang, d: 1 });
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) canal?.postMessage({ type: 'nav', lang, d: 1 });
    if (['ArrowLeft', 'PageUp'].includes(e.key)) canal?.postMessage({ type: 'nav', lang, d: -1 });
  });
} else {
  // ---------- o palco ----------
  document.documentElement.lang = lang;
  document.body.innerHTML = '<div id="stage"><div id="slide"></div><iframe id="panel" title="panel"></iframe></div><div id="status"></div>';
  const m = location.hash.match(/admin=([^&]+)/);
  if (m) { guardar('ws-palco-admin', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  const token = ler('ws-palco-admin') || '';
  const panel = document.getElementById('panel');
  const page = q.get('panel') || DADOS.panelPage;
  if (page) panel.src = `${page.replace(/\/+$/, '')}/?lang=${lang}`;
  const api = (q.get('api') || DADOS.panelApi || '').replace(/\/+$/, '');
  let fase = null;
  let estado = '';
  const status = () => { document.getElementById('status').textContent = `${atual + 1}/${deck.length} · ${deck[atual].fase}${estado ? ` · ${estado}` : ''}${token ? '' : ' · sem token: a fase muda à mão (teclas 1-5 no painel)'}`; };
  async function mudarFase(f) {
    if (f === fase) return;
    fase = f;
    if (!token || !api) return status();
    try {
      const r = await fetch(`${api}/admin/phase`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token }, body: JSON.stringify({ phase: f }) });
      estado = r.ok ? `painel: ${f}` : `painel: erro ${r.status}`;
    } catch { estado = 'painel: sem rede'; }
    status();
  }
  function mostrar(i) {
    atual = Math.min(Math.max(0, i), deck.length - 1);
    guardar(`ws-palco-${lang}`, String(atual));
    const d = deck[atual];
    const el = document.getElementById('slide');
    el.innerHTML = DADOS.imagens[lang] >= deck.length ? `<img alt="${esc(d.titulo)}" src="palco/${lang}/${String(atual + 1).padStart(2, '0')}.png">` : desenhar(d);
    canal?.postMessage({ type: 'slide', lang, i: atual });
    mudarFase(d.fase);
    status();
  }
  const escala = () => {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    const st = document.getElementById('stage');
    st.style.transform = `scale(${k})`;
    st.style.left = `${(innerWidth - 1920 * k) / 2}px`;
    st.style.top = `${(innerHeight - 1080 * k) / 2}px`;
  };
  addEventListener('resize', escala);
  escala();
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); mostrar(atual + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); mostrar(atual - 1); }
    else if (e.key === 'Home') mostrar(0);
    else if (e.key === 'End') mostrar(deck.length - 1);
    else if (e.key === 'n' || e.key === 'N') open(`${location.pathname}?notas=1&lang=${lang}`, 'ws-notas', 'width=1000,height=800');
    else if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.();
  });
  canal?.addEventListener('message', (e) => { if (e.data?.lang === lang && e.data.type === 'nav') mostrar(atual + e.data.d); });
  mostrar(atual);
}
</script>
</body>
</html>
