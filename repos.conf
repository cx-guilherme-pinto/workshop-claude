# repos.conf - UNICA fonte de URLs e versoes do kit.
#
# Formato: CHAVE=valor, uma por linha, sem aspas e sem espacos a volta do "=".
# Linhas comecadas por # sao comentarios. O ficheiro e lido por bash, PowerShell e Node.
# Qualquer chave pode ser sobreposta por uma variavel de ambiente com o mesmo nome.
#
# Marcadores nos padroes:
#   {repo}    URL do repositorio sem ".git"  (ex.: https://servidor/dono/nome)
#   {host}    servidor                       (ex.: servidor)
#   {owner}   dono                           (ex.: dono)
#   {name}    nome do repositorio            (ex.: nome)
#   {version} tag da versao                  (ex.: v1.0.0)
#   {path}    caminho de um ficheiro no repositorio
#   {file}    nome de um asset da release
#
# Para mudar para os repositorios publicos: editar este ficheiro e correr
# tools/switch-repos.sh (ou .ps1). Ver docs/PUBLICAR.md.

WORKSHOP_REPO_URL=https://github.com/cx-guilherme-pinto/workshop-claude.git
WORKSHOP_VERSION=v1.0.0-rc.5

MEMORY_APP_REPO_URL=https://github.com/cx-guilherme-pinto/claude-memory-app.git
MEMORY_APP_VERSION=v0.5.0

# Gitea: {repo}/raw/tag/{version}/{path}
# GitHub: https://raw.githubusercontent.com/{owner}/{name}/{version}/{path}
RAW_BASE_URL=https://raw.githubusercontent.com/{owner}/{name}/{version}/{path}

# Igual em Gitea e GitHub.
RELEASE_DOWNLOAD_URL={repo}/releases/download/{version}/{file}

# Usado so por tools/publish-release.sh (criar releases): gitea | github
RELEASE_PROVIDER=github
GITEA_API_URL=https://{host}/api/v1
GITHUB_API_URL=https://api.github.com
GITHUB_UPLOADS_URL=https://uploads.github.com

# Servidor de desenvolvimento. tools/check-repo.mjs falha se ele aparecer fora deste ficheiro
# (e dos ficheiros gerados), mesmo depois de mudar para os repositorios publicos.
DEV_REPO_HOST=gitea.guilhermepinto.pt

# Versoes fixadas das ferramentas instaladas pelo setup.
CLAUDE_CODE_VERSION=2.1.292
CLAUDE_CODE_MIN_VERSION=2.1.285
NODE_VERSION=24.22.0
NODE_MIN_MAJOR=22
UV_VERSION=0.13.1
# Minimo para usar um uv que ja exista: o passo 10 corre "uv tool install --managed-python" (desde o uv 0.6.8).
UV_MIN_VERSION=0.6.8
GH_VERSION=2.102.0
PYTHON_VERSION=3.12

# Pagina de uma release (igual em Gitea e GitHub).
RELEASE_PAGE_URL={repo}/releases/tag/{version}

# --- Fontes oficiais usadas pelo setup (so aqui; os scripts recebem-nas injetadas) ---
CLAUDE_INSTALL_SH_URL=https://claude.ai/install.sh
CLAUDE_INSTALL_PS1_URL=https://claude.ai/install.ps1
CONSOLE_URL=https://platform.claude.com
# {version} = NODE_VERSION, {file} = node-v<versao>-<so>-<arq>.tar.xz | .zip
NODE_DIST_URL=https://nodejs.org/dist/v{version}/{file}
UV_INSTALL_SH_URL=https://astral.sh/uv/{version}/install.sh
UV_INSTALL_PS1_URL=https://astral.sh/uv/{version}/install.ps1
GH_RELEASE_URL=https://github.com/cli/cli/releases/download/v{version}/{file}
# Git for Windows (so se nao houver git nem winget). SHA-256 da pagina da release.
