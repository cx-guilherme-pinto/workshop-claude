# The live panel's API on Cloudflare (D-30): a Worker and one Durable Object (SQLite) per workshop code.
# Deploy with tools/deploy-panel.sh: it takes WORKSHOP_CODE and the Pages address from repos.conf (--var) and asks
# before each step. The admin token is a secret the organizer types: wrangler secret put ADMIN_TOKEN.
name = "workshop-panel"
main = "index.mjs"
compatibility_date = "2026-08-01"
workers_dev = true

# No request logs (spec 6.6: the server keeps no IPs or headers).
[observability]
enabled = false

[[durable_objects.bindings]]
name = "PANEL"
class_name = "PanelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PanelRoom"]
